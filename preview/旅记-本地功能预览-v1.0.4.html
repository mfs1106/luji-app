<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅记 · 本地功能预览 v1.0.4</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#172338;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;padding:16px 24px;box-shadow:0 2px 12px #12203b12;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:22px;margin:0;color:#2469e8}small{color:#68758b}main{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 22px #12203b0d}h2{margin:0 0 14px;font-size:19px}nav{display:flex;gap:8px;overflow:auto;padding:8px 0}button{border:0;background:#edf3ff;color:#2469e8;border-radius:10px;padding:10px 16px;cursor:pointer;font:inherit;white-space:nowrap}button.primary,nav button.active{background:#2f6bed;color:white}button.danger{color:#ce3449;background:#fff0f2}input,select,textarea{border:1px solid #ced6e3;border-radius:9px;padding:10px;font:inherit;width:100%;background:white}label{display:block;color:#526078;font-size:13px;margin:9px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #edf0f5;border-radius:12px;margin:8px 0}.row>div:first-child{min-width:0}.sub{color:#748197;font-size:13px;margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap}#map,#pickerMap{height:330px;border-radius:12px;background:#e9f1fa}#pickerMap{height:300px}.hint{background:#eaf3ff;color:#3c5d89;border-radius:10px;padding:10px;font-size:13px}.modal{position:fixed;inset:0;background:#06152d99;display:none;align-items:center;justify-content:center;padding:14px;z-index:1000}.modal.open{display:flex}.modal article{background:white;width:min(600px,100%);max-height:94vh;overflow:auto;border-radius:18px;padding:22px}.hidden{display:none!important}.results{max-height:190px;overflow:auto}.results button{display:block;width:100%;text-align:left;margin:5px 0}.pill{display:inline-block;background:#eef4ff;color:#256ae7;border-radius:100px;padding:5px 10px;margin:4px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:680px){.grid,.split{grid-template-columns:1fr}header{display:block}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div><h1>旅记 · 本地功能预览</h1><small>v1.0.4 · 在电脑上测试主要编辑流程，数据保存在此浏览器</small></div><div id="tripTitle">无行程</div></header>
<main><div id="empty" class="card"><h2>暂无行程</h2><p>从空白行程开始规划。</p><button class="primary" onclick="tripForm()">创建新行程</button></div><div id="workspace" class="hidden"><nav id="nav"></nav><section id="view"></section></div></main>
<div class="modal" id="modal"><article><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button onclick="closeModal()">取消</button><button class="primary" id="modalSave">保存</button></div></article></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const KEY='luji-preview-v104';let state=JSON.parse(localStorage.getItem(KEY)||'{"trip":null,"places":[],"routes":[],"expenses":[],"alarms":[],"notes":[]}');let tab='行程',map,pickerMap,chosenPoi=null;const localMinute=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const $=id=>document.getElementById(id),save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()},uid=()=>Math.random().toString(36).slice(2),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),datePlus=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)},days=()=>state.trip?Math.round((new Date(state.trip.end)-new Date(state.trip.start))/86400000)+1:0;
function modal(title,body,submit){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open');$('modalSave').onclick=submit}function closeModal(){$('modal').classList.remove('open')}
function formData(){return Object.fromEntries(new FormData($('form')).entries())}function form(body){return '<form id="form" onsubmit="event.preventDefault();document.getElementById(\'modalSave\').click()">'+body+'</form>'}function field(label,name,value='',type='text',required=true){return `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="0.01" min="0"':''} ${required?'required':''}>`}
function tripForm(){let t=state.trip||{},today=new Date().toISOString().slice(0,10);modal(t.title?'编辑行程':'创建新行程',form(field('行程名称','title',t.title||'')+field('目的地城市','city',t.city||'')+'<div class="grid"><div>'+field('开始日期','start',t.start||today,'date')+'</div><div>'+field('结束日期','end',t.end||today,'date')+'</div></div>'+field('总预算（元）','budget',t.budget??0,'number')),()=>{if(!$('form').reportValidity())return;let d=formData();if(d.end<d.start){alert('结束日期不能早于开始日期');return}state.trip=d;closeModal();save()})}
function picker(onPick){chosenPoi=null;modal('选择地图上已有名称的地点',`<p class="hint">搜索景点、大学、餐厅等已有地点；也可点击地图，由地图查询附近的命名地点。找不到目标时选择附近地点。</p><div class="grid"><input id="poiQuery" placeholder="例如：厦门大学"><button onclick="searchPoi()">搜索地点</button></div><div class="results" id="poiResults"></div><p id="chosenName" class="sub">尚未选定地点</p><div id="pickerMap"></div>`,()=>{if(!chosenPoi){alert('请先选择一个有名称的地点');return}let p=chosenPoi;closeModal();onPick(p)});setTimeout(()=>{pickerMap=L.map('pickerMap').setView([24.48,118.09],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(pickerMap);if(state.places.length)pickerMap.setView([state.places[0].lat,state.places[0].lon],14);pickerMap.on('click',async e=>{let u=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${e.latlng.lat}&lon=${e.latlng.lng}&zoom=18`;try{let x=await(await fetch(u)).json();if(x.name||x.display_name)selectPoi({name:x.name||x.display_name.split(',')[0],lat:+x.lat,lon:+x.lon})}catch{alert('地点查询失败，请检查网络后再试')}})},100)}
async function searchPoi(){let q=$('poiQuery').value.trim();if(!q)return;$('poiResults').textContent='正在查询…';try{let a=await(await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&q='+encodeURIComponent(q+' '+(state.trip?.city||'')))).json();$('poiResults').innerHTML=a.length?'':'未找到，请试试附近的地点名称';a.forEach(x=>{let b=document.createElement('button');b.textContent=x.display_name;b.onclick=()=>selectPoi({name:x.name||x.display_name.split(',')[0],lat:+x.lat,lon:+x.lon});$('poiResults').append(b)})}catch{$('poiResults').textContent='查询失败，请检查网络'}}
function selectPoi(p){chosenPoi=p;$('chosenName').textContent='已选：'+p.name;if(pickerMap){pickerMap.setView([p.lat,p.lon],16);L.marker([p.lat,p.lon]).addTo(pickerMap).bindPopup(p.name).openPopup()}}
function placeForm(id){let old=state.places.find(x=>x.id===id);picker(p=>{let title=old?'编辑地点':'添加地点';modal(title,form(`<p class="hint">地图地点：${esc(p.name)}</p>`+field('行程日期','date',old?.date||state.trip.start,'date')+'<div class="grid"><div>'+field('开始时间','start',old?.start||'09:00','time')+'</div><div>'+field('结束时间','end',old?.end||'10:00','time')+'</div></div>'+field('类型','category',old?.category||'景点')+field('门票/备注','note',old?.note||'', 'text',false)),()=>{if(!$('form').reportValidity())return;let d=formData();if(d.date<state.trip.start||d.date>state.trip.end||d.end<=d.start){alert('日期应在行程内，结束时间须晚于开始时间');return}let item={...d,...p,id:old?.id||uid()};state.places=state.places.filter(x=>x.id!==id);state.places.push(item);if(old)state.routes.forEach(r=>{if(r.placeId===id)r.name=item.name});else state.routes.push({id:uid(),placeId:item.id,name:item.name,date:d.date,start:d.start,end:d.end,mode:'步行'});closeModal();save()})})}
function routeForm(id){let old=state.routes.find(x=>x.id===id),opts=state.places.map(p=>`<option value="${p.id}" ${p.id===old?.placeId?'selected':''}>${esc(p.name)}</option>`).join('');if(!opts){placeForm();return}modal(old?'编辑路线安排':'添加路线安排',form('<label>地点（可重复安排）</label><select name="placeId">'+opts+'</select>'+field('行程日期','date',old?.date||state.trip.start,'date')+'<div class="grid"><div>'+field('开始时间','start',old?.start||'09:00','time')+'</div><div>'+field('结束时间','end',old?.end||'10:00','time')+'</div></div><label>出行方式</label><select name="mode">'+['步行','公交','驾车'].map(x=>`<option ${x===old?.mode?'selected':''}>${x}</option>`).join('')+'</select>'+field('备注','note',old?.note||'','text',false)),()=>{if(!$('form').reportValidity())return;let d=formData();if(d.date<state.trip.start||d.date>state.trip.end||d.end<=d.start){alert('请检查行程日期和起止时间');return}state.routes=state.routes.filter(x=>x.id!==id);state.routes.push({...d,id:old?.id||uid(),name:state.places.find(x=>x.id===d.placeId).name});closeModal();save()})}
function expenseForm(id){let old=state.expenses.find(x=>x.id===id);modal(old?'编辑账目':'记录预算或支出',form('<label>记录类型</label><select name="kind"><option value="paid" '+(old?.kind!=='planned'?'selected':'')+'>实际支出</option><option value="planned" '+(old?.kind==='planned'?'selected':'')+'>计划预算</option></select>'+field('金额（元）','amount',old?.amount||'','number')+'<label>类别</label><select name="category">'+['餐饮','住宿','景点门票','交通','购物','其他'].map(x=>`<option ${x===old?.category?'selected':''}>${x}</option>`).join('')+'</select>'+field('餐厅/酒店/商店/地点','place',old?.place||'')+field('商品或服务名称','item',old?.item||'')+'<label>支付方式</label><select name="payment">'+['微信支付','支付宝','银行卡','现金','其他'].map(x=>`<option ${x===old?.payment?'selected':''}>${x}</option>`).join('')+'</select>'+field('用途与详细说明','note',old?.note||'','text',false)),()=>{if(!$('form').reportValidity())return;let d=formData();if(+d.amount<=0){alert('金额必须大于 0');return}state.expenses=state.expenses.filter(x=>x.id!==id);state.expenses.push({...d,id:old?.id||uid()});closeModal();save()})}
function alarmForm(id){let old=state.alarms.find(x=>x.id===id);modal(old?'编辑时间提醒':'添加时间提醒',form(field('标题','title',old?.title||'')+field('提醒内容','body',old?.body||'','text',false)+field('提醒日期与时间','when',old?.when||localMinute(new Date(Date.now()+3600000)),'datetime-local')+'<label>重复</label><select name="repeat"><option value="once">仅一次</option><option value="daily" '+(old?.repeat==='daily'?'selected':'')+'>每天</option></select>'),async()=>{if(!$('form').reportValidity())return;let d=formData();if(d.repeat==='once'&&new Date(d.when)<=new Date()){alert('请选择将来的时间');return}state.alarms=state.alarms.filter(x=>x.id!==id);state.alarms.push({...d,id:old?.id||uid(),enabled:true,last:''});if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission();closeModal();save()})}
function noteForm(id){let old=state.notes.find(x=>x.id===id);modal(old?'编辑笔记':'添加旅行笔记',form(field('日期','date',old?.date||state.trip.start,'date')+'<label>内容</label><textarea name="content" required rows="7">'+esc(old?.content||'')+'</textarea>'),()=>{if(!$('form').reportValidity())return;let d=formData();state.notes=state.notes.filter(x=>x.id!==id);state.notes.push({...d,id:old?.id||uid()});closeModal();save()})}
function remove(kind,id){if(!confirm('确定删除？'))return;state[kind]=state[kind].filter(x=>x.id!==id);if(kind==='places')state.routes=state.routes.filter(x=>x.placeId!==id);save()}
function navTo(t){tab=t;render()}function navLink(p){return `https://uri.amap.com/navigation?to=${p.lon},${p.lat},${encodeURIComponent(p.name)}&mode=car&src=luji-preview`}
function itemRow(primary,sub,buttons){return `<div class="row"><div><strong>${esc(primary)}</strong><div class="sub">${esc(sub)}</div></div><div class="actions">${buttons}</div></div>`}function editButton(call){return `<button onclick="${call}">编辑</button>`}function delButton(kind,id){return `<button class="danger" onclick="remove('${kind}','${id}')">删除</button>`}
function mapView(){return '<div class="card"><h2>路线地图</h2><p class="hint">按行程当天的安排顺序连线。点击“道路导航”会在高德地图网页版查看真实道路路线。</p><div id="map"></div></div>'}
function renderMap(){let el=$('map');if(!el||typeof L==='undefined')return;let ps=state.routes.filter(x=>x.date===window.selectedDay).sort((a,b)=>a.start.localeCompare(b.start)).map(x=>state.places.find(p=>p.id===x.placeId)).filter(Boolean);map=L.map('map').setView(ps.length?[ps[0].lat,ps[0].lon]:[24.48,118.09],ps.length?13:10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);ps.forEach((p,i)=>L.marker([p.lat,p.lon]).addTo(map).bindPopup(`${i+1}. ${esc(p.name)}`));if(ps.length>1){let line=L.polyline(ps.map(p=>[p.lat,p.lon]),{color:'#2f6bed',weight:5}).addTo(map);map.fitBounds(line.getBounds(),{padding:[30,30]})}setTimeout(()=>map.invalidateSize(),150)}
function render(){let t=state.trip;$('empty').classList.toggle('hidden',!!t);$('workspace').classList.toggle('hidden',!t);$('tripTitle').textContent=t?`${t.title} · ${days()} 天 · ${t.start} 至 ${t.end}`:'无行程';if(!t)return;let tabs=['行程','路线','记账','时间提醒','笔记'];$('nav').innerHTML=tabs.map(x=>`<button class="${tab===x?'active':''}" onclick="navTo('${x}')">${x}</button>`).join('')+'<button onclick="tripForm()">编辑行程</button>';let html='';if(tab==='行程'){html=`<div class="card"><h2>景点行程 · ${days()} 天</h2><p class="hint">选地图上已有名称的地点，不需要填写经纬度。新地点会自动加入路线。</p><button class="primary" onclick="placeForm()">＋ 从地图添加地点</button>${state.places.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)).map(p=>itemRow(p.name,`${p.date} ${p.start}–${p.end} · ${p.category} · ${p.note||''}`,`<a target="_blank" href="${navLink(p)}"><button>导航</button></a>${editButton(`placeForm('${p.id}')`)}${delButton('places',p.id)}`)).join('')}</div>`}
if(tab==='路线'){let options=Array.from({length:days()},(_,i)=>datePlus(t.start,i));window.selectedDay=options.includes(window.selectedDay)?window.selectedDay:t.start;html=`<div class="card"><h2>路线规划</h2><div class="actions">${options.map((x,i)=>`<button class="${window.selectedDay===x?'primary':''}" onclick="window.selectedDay='${x}';render()">第 ${i+1} 天 · ${x}</button>`).join('')}</div><p><button class="primary" onclick="routeForm()">＋ 添加路线安排</button> <button onclick="placeForm()">从地图新增地点</button></p>${state.routes.filter(x=>x.date===window.selectedDay).sort((a,b)=>a.start.localeCompare(b.start)).map((r,i,arr)=>{let p=state.places.find(x=>x.id===r.placeId),prev=i?state.places.find(x=>x.id===arr[i-1].placeId):null;let u=p?navLink(p)+(prev?`&from=${prev.lon},${prev.lat},${encodeURIComponent(prev.name)}`:''):'';return itemRow(`${r.start}–${r.end} ${r.name}`,`${r.mode} · ${r.note||''}`,`${p?`<a target="_blank" href="${u}"><button>道路导航</button></a>`:''}${editButton(`routeForm('${r.id}')`)}${delButton('routes',r.id)}`)}).join('')}</div>`+mapView()}
if(tab==='记账'){let paid=state.expenses.filter(x=>x.kind!=='planned').reduce((a,x)=>a+(+x.amount),0),planned=state.expenses.filter(x=>x.kind==='planned').reduce((a,x)=>a+(+x.amount),0);html=`<div class="card"><h2>旅行记账</h2><p>实付 <strong>¥${paid.toFixed(2)}</strong>　计划支出 ¥${planned.toFixed(2)}　行程预算 ¥${(+t.budget).toFixed(2)}　剩余 ¥${(+t.budget-paid).toFixed(2)}</p><button class="primary" onclick="expenseForm()">＋ 记预算或支出</button>${state.expenses.map(e=>itemRow(`${e.kind==='planned'?'计划':'实付'} · ${e.item} · ¥${(+e.amount).toFixed(2)}`,`${e.category} · ${e.place} · ${e.payment} · ${e.note||''}`,`${editButton(`expenseForm('${e.id}')`)}${delButton('expenses',e.id)}`)).join('')}</div>`}
if(tab==='时间提醒'){html=`<div class="card"><h2>时间提醒</h2><p class="hint">电脑预览仅在页面保持打开时检查提醒；Android APK 由系统安排定时通知和提示音。</p><button class="primary" onclick="alarmForm()">＋ 添加时间提醒</button>${state.alarms.map(a=>itemRow(a.title,`${a.when.replace('T',' ')} · ${a.repeat==='daily'?'每天':'仅一次'} · ${a.body||''}`,`<button onclick="toggleAlarm('${a.id}')">${a.enabled?'关闭':'开启'}</button>${editButton(`alarmForm('${a.id}')`)}${delButton('alarms',a.id)}`)).join('')}</div>`}
if(tab==='笔记'){html=`<div class="card"><h2>旅行笔记</h2><button class="primary" onclick="noteForm()">＋ 新建笔记</button>${state.notes.map(n=>itemRow(n.content,n.date,`${editButton(`noteForm('${n.id}')`)}${delButton('notes',n.id)}`)).join('')}</div>`}$('view').innerHTML=html;if(tab==='路线')setTimeout(renderMap,50)}
function toggleAlarm(id){let a=state.alarms.find(x=>x.id===id);a.enabled=!a.enabled;save()}setInterval(()=>{let minute=localMinute(new Date());for(let a of state.alarms){if(!a.enabled||a.last===minute)continue;let due=a.repeat==='daily'?a.when.slice(11)===minute.slice(11):a.when===minute;if(due){a.last=minute;save();if('Notification'in window&&Notification.permission==='granted')new Notification(a.title,{body:a.body||'时间到了'});else alert('旅记提醒：'+a.title)}}},10000);render();
</script></body></html>
