name: luji_app
description: 旅记 · 一体化旅游规划 APP（自动化旅行笔记本）
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # 本地数据库（本地优先架构）
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.3
  # 第三方唤起（高德/百度 URI、美团 H5）
  url_launcher: ^6.2.6
  # 定点提醒：本地通知 + 定位（地理围栏）
  flutter_local_notifications: ^17.2.2
  geolocator: ^12.0.0
  timezone: ^0.9.4
  # App 内高德实时地图（Key 未配置时自动降级手绘示意地图）
  amap_flutter_map_plus_x:
    path: third_party/amap_flutter_map_plus_x
  amap_flutter_base_plus: ^3.1.0
  # 隐私同意等轻量本地标记（高德 SDK 合规要求）
  shared_preferences: ^2.2.3
  # 电子票二维码本地生成
  qr_flutter: ^4.1.0
  # 优惠券截图 OCR（相册选图）
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: 2.4.4

flutter:
  uses-material-design: true
  # 如需自定义字体，将字体文件放入 assets/fonts 后取消注释：
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
